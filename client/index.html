<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2" />
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico?v=2" />
    <link rel="apple-touch-icon" href="%VITE_APP_LOGO%" />
    <title>%VITE_APP_TITLE%</title>
    <!-- Add Google Fonts here, example:
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    -->
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=AW-17675352374"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'AW-17675352374');
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script>
      // Add build timestamp to help detect cached bundles
      window.__BUILD_TIME__ = new Date().toISOString();
      console.log('[App] Build time:', window.__BUILD_TIME__);
      
      // Check if app loads - use longer timeout in production (30s) vs development (15s)
      // In production, API calls during login can take longer
      const isProduction = window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1';
      const timeoutDuration = isProduction ? 30000 : 15000; // 30s in prod, 15s in dev
      
      const loadingTimeout = setTimeout(() => {
        const root = document.getElementById('root');
        if (root && root.children.length === 0) {
          console.error('[App] App failed to load after ' + timeoutDuration + 'ms - likely cached bundle issue or API timeout');
          root.innerHTML = `
            <div style="padding: 20px; font-family: sans-serif; text-align: center; max-width: 600px; margin: 50px auto;">
              <h1>Loading Issue Detected</h1>
              <p>The app seems to be stuck. This is often caused by cached files or a slow connection.</p>
              <p style="margin-top: 20px; margin-bottom: 10px;">
                <button onclick="window.location.reload(true)" style="padding: 12px 24px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; font-size: 16px;">
                  Hard Reload (Clear Cache)
                </button>
              </p>
              <p style="margin-top: 10px;">
                <button onclick="localStorage.clear(); sessionStorage.clear(); window.location.reload(true)" style="padding: 10px 20px; cursor: pointer; background: #dc3545; color: white; border: none; border-radius: 4px; font-size: 14px;">
                  Clear All Data & Reload
                </button>
              </p>
              <p style="margin-top: 15px; font-size: 14px; color: #666;">
                Keyboard shortcut: <strong>Ctrl+Shift+R</strong> (Windows/Linux) or <strong>Cmd+Shift+R</strong> (Mac)
              </p>
              <p style="margin-top: 10px; font-size: 12px; color: #999;">
                If the problem persists, try opening in an incognito/private window.
              </p>
            </div>
          `;
        }
      }, timeoutDuration);
      
      // Clear timeout if app loads successfully
      // The main.tsx will clear this when React renders
      window.addEventListener('DOMContentLoaded', () => {
        setTimeout(() => {
          const root = document.getElementById('root');
          if (root && root.children.length > 0) {
            clearTimeout(loadingTimeout);
          }
        }, 100);
      });
      
      // Also listen for the app rendered callback from main.tsx
      window.addEventListener('app-rendered', () => {
        clearTimeout(loadingTimeout);
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Analytics script will be conditionally injected if env vars are set -->
  </body>

</html>
