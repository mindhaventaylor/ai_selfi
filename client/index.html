<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="%VITE_APP_LOGO%" />
    <title>%VITE_APP_TITLE%</title>
    <!-- Add Google Fonts here, example:
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    -->
  </head>

  <body>
    <div id="root"></div>
    <script>
      // Add build timestamp to help detect cached bundles
      window.__BUILD_TIME__ = new Date().toISOString();
      console.log('[App] Build time:', window.__BUILD_TIME__);
      
      // Check if app loads within 5 seconds
      setTimeout(() => {
        const root = document.getElementById('root');
        if (root && root.children.length === 0) {
          console.error('[App] App failed to load - likely cached bundle issue');
          root.innerHTML = `
            <div style="padding: 20px; font-family: sans-serif; text-align: center; max-width: 600px; margin: 50px auto;">
              <h1>Loading Issue Detected</h1>
              <p>The app seems to be stuck. This is often caused by cached files.</p>
              <p style="margin-top: 20px;">
                <button onclick="window.location.reload(true)" style="padding: 12px 24px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; font-size: 16px;">
                  Hard Reload (Clear Cache)
                </button>
              </p>
              <p style="margin-top: 15px; font-size: 14px; color: #666;">
                Keyboard shortcut: <strong>Ctrl+Shift+R</strong> (Windows/Linux) or <strong>Cmd+Shift+R</strong> (Mac)
              </p>
            </div>
          `;
        }
      }, 5000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Analytics script will be conditionally injected if env vars are set -->
  </body>

</html>
